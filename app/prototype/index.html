<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Liga da Promessa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700;1,800&display=swap">
<style>
/* Layout: app de celular em coluna única no estilo do kit de referência: fundo grafite, faixas lilás, pílulas brancas, destaques limão, barra inferior lilás. Tema escuro único, por escolha. */
:root{
  --bg:#232323; --panel:#2e2e2e; --line:#3a3a3a;
  --lav:#b3a0ff; --purple:#896cfe; --lime:#e2f163;
  --white:#ffffff; --ink:#232323; --muted:#a6a6a6; --soft:#f2f0ff;
  --bad:#ff7a6b; --bad-bg:#4a2622;
  --font:'Poppins',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--white);font-family:var(--font);font-size:14px;line-height:1.45;margin:0;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.pad{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}

/* cabeçalho */
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-top:14px;padding-bottom:12px}
.hd .back{color:var(--lime);display:flex;align-items:center;margin-left:-6px}
.hd h1{color:var(--purple);font-size:20px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .ics{display:flex;gap:12px;color:var(--purple)}
.hd .ics svg{width:20px;height:20px}
.hello{flex:1;min-width:0}
.hello h1{font-size:22px}
.hello p{margin:0;font-size:12px;color:var(--white);font-weight:500}

/* blocos */
.band{background:var(--lav);padding-top:18px;padding-bottom:18px}
.sec{padding-top:16px;padding-bottom:6px;display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-h h2{color:var(--lime);font-size:17px;font-weight:600}
.sec-h a,.sec-h span{font-size:12px;color:var(--white);font-weight:500;text-decoration:none}
.muted{color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);padding-top:4px;padding-bottom:10px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--lime);font-size:11px;padding:4px 0}
.quick button span{color:var(--lav);font-weight:500}
.quick button+button{border-left:1px solid var(--lav)}
.quick svg{width:28px;height:28px}

/* pílulas */
.pills{display:flex;gap:10px;flex-wrap:wrap}
.pill{border-radius:999px;padding:7px 18px;font-weight:500;font-size:13px;background:var(--white);color:var(--purple)}
.pill[aria-pressed="true"]{background:var(--lime);color:var(--ink)}
.btn{border-radius:999px;padding:11px 22px;font-weight:600;font-size:14px;text-align:center}
.btn.lime{background:var(--lime);color:var(--ink)}
.btn.dark{background:var(--panel);color:var(--white);border:1px solid #555}
.btn.white{background:var(--white);color:var(--purple)}
.btn.sm{padding:6px 14px;font-size:12px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:11px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.lime{background:var(--lime);color:var(--ink)}
.chip.purple{background:var(--purple);color:var(--white)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.ghost{background:rgba(255,255,255,.12);color:var(--white)}

/* linha em pílula branca (estilo "Round 1") */
.rows{display:flex;flex-direction:column;gap:10px}
.prow{background:var(--white);color:var(--ink);border-radius:999px;display:flex;align-items:center;gap:12px;padding:8px 16px 8px 8px;text-align:left;width:100%}
.prow .dot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:700;font-size:12px;color:var(--white);background:var(--purple)}
.prow .dot.lime{background:var(--lime);color:var(--ink)}
.prow .dot.bad{background:var(--bad);color:var(--white)}
.prow .tx{flex:1;min-width:0}
.prow .tx b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .tx small{color:#6b6b6b;font-size:11px;display:flex;align-items:center;gap:4px}
.prow .rt{color:var(--purple);font-weight:600;font-size:13px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.prow .rt small{display:block;font-size:11px;font-weight:500;color:#6b6b6b}
.prow.me{background:var(--lime)}
.prow.me .rt,.prow.me .rt small,.prow.me .tx small{color:var(--ink)}
.mini-bar{height:5px;border-radius:9px;background:#e6e1ff;margin-top:4px;overflow:hidden}
.mini-bar i{display:block;height:100%;background:var(--purple);border-radius:9px}
.mini-bar.over i{background:var(--bad)}
.mini-bar.ok i{background:#9ab31b}

/* cartões com "foto" */
.photo{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:16/10;max-width:100%;display:block;color:var(--white)}
.photo .art{position:absolute;inset:0}
.photo .art svg{position:absolute;right:-8%;bottom:-12%;width:70%;height:auto;opacity:.22;stroke:#fff;fill:none;stroke-width:1.2}
.photo .star{position:absolute;top:8px;right:8px;color:var(--lime)}
.photo .star svg{width:18px;height:18px;fill:var(--lime);stroke:var(--lime)}
.photo .tag{position:absolute;top:0;right:0;background:var(--lime);color:var(--ink);font-size:11px;font-weight:600;padding:4px 12px;border-radius:0 0 0 14px}
.photo .cap{position:absolute;left:0;right:0;bottom:0;padding:8px 10px;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.photo .cap b{display:block;color:var(--lime);font-size:13px;font-weight:600}
.photo .cap small{display:flex;gap:10px;font-size:10px;color:var(--white)}
.g-a{background:linear-gradient(135deg,#3b3355,#6b58c9)} .g-b{background:linear-gradient(135deg,#2f4a3a,#5e8f5a)}
.g-c{background:linear-gradient(135deg,#4d3a2e,#a06a45)} .g-d{background:linear-gradient(135deg,#2c3c55,#4f78b0)}
.g-e{background:linear-gradient(135deg,#4a2f4a,#9b5a9b)} .g-f{background:linear-gradient(135deg,#3a3a3a,#6a6a6a)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2>*{min-width:0}
.card-out{border:1px solid var(--lime);border-radius:16px;padding:12px}
.challenge{display:grid;grid-template-columns:1.1fr 1fr;background:var(--ink);border-radius:20px;overflow:hidden;min-height:120px}
.challenge .l{padding:16px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.challenge .l b{color:var(--lime);font-size:22px;line-height:1.1;font-weight:600}
.challenge .l small{font-size:11px}
.challenge .photo{border-radius:0;aspect-ratio:auto;height:100%}

/* ranking */
.profile{display:flex;align-items:center;gap:14px;color:var(--white)}
.profile .who{flex:1;min-width:0}
.profile h2{font-size:22px}
.stats{display:flex;gap:18px;margin-top:6px}
.stat{display:flex;gap:8px;align-items:stretch}
.stat i{width:4px;border-radius:4px;background:var(--lime)}
.stat b{display:block;font-size:15px;line-height:1.2}
.stat small{font-size:11px}
.av{border-radius:50%;display:grid;place-items:center;font-weight:700;color:var(--white);flex:none}
.pod{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:end}
.pod .p{background:var(--ink);border-radius:18px;padding:12px 6px;text-align:center;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.pod .p.first{padding-top:20px;padding-bottom:18px;outline:2px solid var(--lime)}
.pod .nm{font-size:13px;font-weight:600;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod .pt{color:var(--lime);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.pod .ps{font-size:11px;color:var(--lav)}
.pot{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--purple);border-radius:18px;padding:14px 18px}
.pot b{font-size:24px;color:var(--lime)}

/* promessa */
.banner{border-radius:16px;padding:12px 14px;font-size:13px;font-weight:500;background:var(--ink);color:var(--white)}
.banner b{color:var(--lime)}
.hab-extra{display:flex;justify-content:space-between;gap:8px;padding:2px 18px 0;font-size:11px;color:var(--muted)}

/* feed */
.post{display:flex;flex-direction:column;gap:10px}
.post-h{display:flex;gap:10px;align-items:center}
.post-h b{color:var(--lime);font-size:14px}
.post-h small{display:block;color:var(--muted);font-size:11px}
.post-h .fav{margin-left:auto;color:var(--lime)}
.post p{margin:0;font-size:13px}
.acts{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--lav)}
.acts button{display:flex;align-items:center;gap:5px;color:var(--lav)}
.acts button svg{width:16px;height:16px}
.acts button[aria-pressed="true"]{color:var(--lime)}
.acts button.flag[aria-pressed="true"]{color:var(--bad)}
.cmt{font-size:12px;color:var(--muted)} .cmt b{color:var(--white)}

/* progresso */
.cal{background:var(--white);color:var(--ink);border-radius:20px;padding:14px}
.cal-w{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:8px}
.cal-w span{background:var(--purple);color:var(--white);border-radius:999px;font-size:10px;font-weight:600;text-align:center;padding:2px 0}
.cal-d{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:12px;color:var(--purple);font-weight:500}
.cal-d span{aspect-ratio:1;display:grid;place-items:center;border-radius:50%;max-width:100%}
.cal-d .on{background:var(--lime);color:var(--ink);font-weight:700}
.cal-d .today{outline:2px solid var(--purple)}
.chart{border:1px solid #6a6a6a;border-radius:18px;padding:14px}
.chart svg text{fill:var(--white);font-family:var(--font);font-size:11px}
.strip{display:grid;grid-template-columns:auto 1px 1fr 1fr;gap:12px;align-items:center;background:var(--purple);border-radius:12px;padding:10px 14px}
.strip .d{text-align:center;line-height:1.1}
.strip .d small{font-size:11px} .strip .d b{font-size:20px;display:block}
.strip hr{border:0;width:1px;height:34px;background:rgba(255,255,255,.5);margin:0}
.strip .v small{display:block;font-size:11px}
.strip .v b{font-size:17px;font-variant-numeric:tabular-nums}

/* abertura e login */
.splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center;background:radial-gradient(circle at 50% 35%,#3a3358,var(--bg) 65%)}
.logo{display:flex;flex-direction:column;align-items:center;gap:6px}
.mark{font-style:italic;font-weight:800;font-size:58px;line-height:1;color:var(--purple);letter-spacing:-2px}
.mark span{color:var(--lime)}
.word{font-style:italic;font-weight:800;font-size:26px;color:var(--lime);letter-spacing:.5px;text-transform:uppercase}
.word span{color:var(--lav)}
.splash p{margin:0;max-width:30ch;color:var(--white);font-size:13px}
.login h2{color:var(--lime);text-align:center;font-size:20px;padding-top:6px}
.login .welcome{text-align:center;padding-bottom:18px}
.login .welcome h3{font-size:22px}
.login .welcome p{margin:6px auto 0;max-width:34ch;font-size:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{color:var(--ink);font-size:13px;font-weight:600}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=search],select{width:100%;font:inherit;color:var(--ink);background:var(--white);border:0;border-radius:14px;padding:11px 14px}
.form{display:flex;flex-direction:column;gap:12px}
.center{display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:22px;padding-bottom:30px}
.socials{display:flex;gap:12px}
.socials span{width:38px;height:38px;border-radius:50%;background:var(--white);color:var(--purple);display:grid;place-items:center;font-weight:700;font-size:14px}

/* barra inferior e botão flutuante */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center}
.nav-in{width:100%;max-width:480px;background:var(--lav);border-radius:22px 22px 0 0;display:grid;grid-template-columns:repeat(4,1fr);
  padding:10px max(8px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--white);font-size:10px;font-weight:500;padding:4px 0}
.nav button svg{width:26px;height:26px}
.nav button[aria-selected="true"]{color:var(--ink);font-weight:700}
.fab{position:fixed;z-index:7;right:max(18px,calc(50% - 222px));bottom:calc(84px + env(safe-area-inset-bottom,0px));
  background:var(--lime);color:var(--ink);border-radius:999px;padding:12px 18px;font-weight:700;display:flex;gap:6px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.45)}
.fab svg{width:18px;height:18px}
.spacer{height:120px}

/* folhas */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;display:flex;justify-content:center}
.sheet-in{background:var(--bg);width:100%;max-width:480px;border-radius:24px 24px 0 0;max-height:88vh;overflow:auto;border-top:3px solid var(--lav)}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:16px;padding-bottom:10px}
.sheet-h h2{color:var(--purple);font-size:19px}
.sheet-b{padding-top:14px;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet .band{display:flex;flex-direction:column;gap:12px}
.preview{background:var(--ink);color:var(--white);border-radius:14px;padding:10px 14px;font-size:12px}
.preview b{color:var(--lime)}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.cats .pill{white-space:nowrap;padding:6px 14px;font-size:12px}
.cat-item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.cat-item>div{min-width:0}
.cat-item b{font-weight:600;font-size:13px}
.cat-item small{color:var(--muted);display:block;font-size:11px}
.note{font-size:11px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--lime);color:var(--ink);font-weight:600;
  border-radius:999px;padding:9px 18px;font-size:12px;z-index:30;max-width:90vw;text-align:center}
.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.rules li::marker{color:var(--lime)}
@media (prefers-reduced-motion:no-preference){.mini-bar i{transition:width .35s ease}.screen{animation:in .25s ease}@keyframes in{from{opacity:.4}to{opacity:1}}}
</style>

</head><body><div class="app" id="app"></div>
<div id="layer"></div>
<div id="toast-box"></div>

const BASE_MIN=10, BASE_MAX=6, MULTA=4, BONUS=5, PRAZO='domingo, 20h';

/* pontuação: meta mínima proporcional; limite máximo ganha dentro do limite e perde por unidade excedente */
function ptsHab(p){
  const h=H[p.id];
  if(h.modo==='min'){const f=Math.min(1,p.real/p.meta);return Math.round(BASE_MIN*f+(p.real>=p.meta?BONUS:0))}
  return p.real<=p.meta?BASE_MAX:-(p.real-p.meta)*MULTA;
}
const meusPts=()=>state.promessa.reduce((s,p)=>s+ptsHab(p),0);

   <div class="sec pad"><div class="sec-h"><h2>Sua promessa</h2><a href="#" data-tab-go="promessa">Ver tudo ›</a></div><div class="grid2">${cards}</div></div>
   <div class="band pad" style="margin-top:14px"><div class="challenge"><div class="l"><b>Desafio da semana</b><small>7 dias seguidos com algum movimento</small><span class="chip lime" style="align-self:flex-start;margin-top:6px">+10 pts de bônus</span></div>
    <div class="photo g-a">${art('Consistência e comunidade').svg}</div></div></div>
   <div class="sec pad"><div class="sec-h"><h2>Ranking da semana</h2><a href="#" data-tab-go="rank">Ver tudo ›</a></div>
    <div class="rows">${r.slice(0,3).map((p,i)=>rowPlayer(p,i)).join('')}</div></div>
   <div class="spacer"></div></div>`;
}
function rowPlayer(p,i){
  return `<div class="prow ${p.id===0?'me':''}"><span class="dot ${i===0?'lime':''}">${i+1}º</span>${av(p,34)}
   <div class="tx"><b>${p.nome}${p.id===0?' (você)':''}</b><small>${ic('flame','i" style="width:13px;height:13px')}${p.streak>0?dias(p.streak):'sem sequência'}</small></div>
   <div class="rt">${p.pts} pts<small>+${p.hoje} hoje</small></div></div>`;
}
function sRank(){
  const r=ranking(), me=players[0], pos=r.indexOf(me)+1, t3=[r[1],r[0],r[2]];
  return `<div class="screen">${header('Ranking')}
   <div class="band pad"><div class="profile">${av(me,64)}<div class="who"><h2>${me.nome}</h2><div class="stats">
     <div class="stat"><i></i><div><b>${pos}º</b><small>posição</small></div></div><div class="stat"><i></i><div><b>${me.pts}</b><small>pontos</small></div></div><div class="stat"><i></i><div><b>${me.streak}</b><small>sequência</small></div></div></div></div></div></div>
   <div class="sec pad"><div class="pills"><span class="pill" aria-pressed="true">Semana 12</span><span class="pill">Geral</span></div>
    <div class="pod">${t3.map((p,i)=>`<div class="p ${i===1?'first':''}">${av(p,i===1?52:42)}<div class="nm">${p.nome}</div><div class="pt">${p.pts}</div><div class="ps">${i===1?'1º':i===0?'2º':'3º'} lugar</div></div>`).join('')}</div>
    <div class="rows">${r.map((p,i)=>rowPlayer(p,i)).join('')}</div>
    <div class="pot"><div><small>Pote da semana</small><br><b>R$ 60</b></div><small style="text-align:right">6 jogadores · R$ 10 cada<br>quem lidera leva</small></div></div>
   <div class="spacer"></div></div>`;
}
function sProm(){
  const ed=state.fase==='montagem';
  const rows=state.promessa.map((p,idx)=>{const h=H[p.id],pt=ptsHab(p),mx=h.modo==='max',over=mx&&p.real>p.meta,pc=Math.round(pct(p));
    const dot=over?'bad':(!mx&&p.real>=p.meta)||(mx&&!over)?'lime':'';
    return `<div><button class="prow" ${ed?`data-edit="${idx}"`:`data-log="${idx}"`}><span class="dot ${dot}">${mx?(over?'!':'ok'):pc+'%'}</span>
     <span class="tx"><b>${h.nome}</b><small>${mx?'limite':'meta'} ${fmt(p.meta)} ${h.unidade}</small><span class="mini-bar ${over?'over':mx?'ok':''}"><i style="width:${pc}%"></i></span></span>
     <span class="rt">${ed?'Editar':`${fmt(p.real)}/${fmt(p.meta)}`}<small>${sinal(pt)} pts</small></span></button>
     ${ed?`<div class="hab-extra"><span>${h.categoria}</span><button class="note" data-rm="${idx}" style="color:var(--bad)">Remover</button></div>`:''}</div>`}).join('');
  return `<div class="screen">${header('Promessa')}
   <div class="sec pad"><div class="pills" role="group" aria-label="Simular fase (protótipo)"><button class="pill" id="f-m" aria-pressed="${ed}">Montagem</button><button class="pill" id="f-s" aria-pressed="${!ed}">Semana</button></div>
    <div class="banner">${ed?`Monte sua promessa até <b>${PRAZO}</b>. Depois disso ela trava e ninguém edita.`:`Promessa travada. Toque num hábito para registrar. <b>Sem post, não vale.</b>`}</div></div>
   <div class="band pad"><div class="sec-h" style="margin-bottom:12px"><h2 style="color:var(--ink)">Semana 12</h2><span style="color:var(--ink)">${state.promessa.length} hábitos · <b>${sinal(meusPts())} pts</b></span></div>
    <div class="rows">${rows||'<p style="color:var(--ink)">Nenhum hábito ainda.</p>'}</div>
    ${ed?`<button class="btn white" id="add" style="width:100%;margin-top:14px">+ Adicionar do catálogo (${CATALOG.habitos.length})</button>`:''}</div>
   <div class="sec pad"><div class="sec-h"><h2>Mínimos do grupo</h2></div><div class="card-out" style="font-size:13px">Valem para todos: 3 sessões de treino e no máximo 2 doces. Entram na promessa automaticamente.</div></div>
   <div class="spacer"></div></div>`;
}
function sFeed(){
  const posts=state.posts.map(po=>{const a=players[po.autor],h=H[po.hab],ar=art(h.categoria);
    return `<article class="card-out post"><div class="post-h">${av(a,36)}<div><b>${a.nome}</b><small>${po.quando} · ${h.nome}</small></div><span class="fav">${ic('star')}</span></div>
     <p>${po.txt}</p>${po.foto?`<div class="photo ${ar.g}">${ar.svg}<span class="tag">${po.valor}</span><span class="cap"><small>foto da evidência</small></span></div>`:`<span class="chip lime" style="align-self:flex-start">${po.valor}</span>`}
     ${po.flag?`<span class="chip bad" style="align-self:flex-start">${po.flag} contestação</span>`:''}
     ${po.coment.map(c=>`<div class="cmt"><b>${c[0]}</b> ${c[1]}</div>`).join('')}
     <div class="acts"><button data-like="${po.id}" aria-pressed="${!!po.eu}">${ic('heart')}${po.curt}</button><button data-cm="${po.id}">${ic('chat')}${po.coment.length}</button>
      <button class="flag" data-flag="${po.id}" aria-pressed="${!!po.contestei}">${ic('flag')}Contestar</button></div></article>`}).join('');
  return `<div class="screen">${header('Comunidade')}<div class="sec pad"><div class="pills"><span class="pill" aria-pressed="true">Feed</span><span class="pill">Fotos</span><span class="pill">Contestados</span></div>${posts}</div><div class="spacer"></div></div>`;
}
function sProg(){
  const lg=state.progTab==='log';
  let body='';
  if(lg){
    const cells=[];for(let i=0;i<6;i++)cells.push('<span></span>');
    for(let d=1;d<=30;d++)cells.push(`<span class="${state.checkins.includes(d)?'on':''} ${d===15?'today':''}">${d}</span>`);
    body=`<div class="sec-h"><h2 style="color:var(--white);font-size:14px">Novembro 2026</h2><span>${state.checkins.length} check-ins</span></div>
     <div class="cal"><div class="cal-w">${['SEG','TER','QUA','QUI','SEX','SÁB','DOM'].map(x=>`<span>${x}</span>`).join('')}</div><div class="cal-d">${cells.join('')}</div></div>
     <div class="sec-h"><h2>Atividades</h2></div>
     <div class="rows">${state.atividades.map(a=>{const h=H[a.hab],k=(CAT_ART[h.categoria]||['star'])[0];
       return `<div class="prow"><span class="dot">${ic(k)}</span><span class="tx"><b>${h.nome}</b><small>${a.quando}</small></span><span class="rt">${a.valor}<small>${sinal(a.pts)} pts</small></span></div>`}).join('')}</div>`;
  } else {
    const ws=[...state.semanas,{s:'S12',p:players[0].base+meusPts()}], mx=100, W=300, Hh=170, bw=22;
    const step=(W-40)/ws.length;
    const bars=ws.map((w,i)=>{const x=40+step*i+(step-bw)/2,h=Math.max(0,w.p)/mx*(Hh-30);return `<rect x="${x}" y="10" width="${bw}" height="${Hh-30}" rx="11" fill="#d9d9d9"/><rect x="${x}" y="${10+(Hh-30)-h}" width="${bw}" height="${h}" rx="11" fill="${i===ws.length-1?'#e2f163':'#c9d94f'}"/><text x="${x+bw/2}" y="${Hh-2}" text-anchor="middle">${w.s}</text>`}).join('');
    const ticks=[0,50,100].map(t=>`<text x="30" y="${10+(Hh-30)-(t/mx)*(Hh-30)+4}" text-anchor="end">${t}</text>`).join('');
    body=`<div><div class="muted" style="font-size:12px">Meu progresso</div><h2 style="color:var(--lime);font-size:22px">Pontos por semana</h2></div>
     <div class="chart"><svg viewBox="0 0 ${W} ${Hh}" width="100%" role="img" aria-label="Pontos nas últimas 6 semanas">${ticks}${bars}</svg></div>
     <div class="rows">${ws.slice(-3).reverse().map(w=>`<div class="strip"><div class="d"><small>Sem.</small><b>${w.s.slice(1)}</b></div><hr><div class="v"><small>Pontos</small><b>${w.p}</b></div><div class="v"><small>Posição</small><b>${w.p>75?'1º':w.p>60?'2º':'3º'}</b></div></div>`).join('')}</div>`;
  }
  return `<div class="screen">${header('Progresso',true)}
   <div class="band pad"><div class="profile">${av(players[0],60)}<div class="who"><h2>${players[0].nome}</h2><div class="stats"><div class="stat"><i></i><div><b>${players[0].total+meusPts()}</b><small>pontos totais</small></div></div><div class="stat"><i></i><div><b>${players[0].streak}</b><small>dias seguidos</small></div></div></div></div></div></div>
   <div class="sec pad"><div class="pills"><button class="pill" data-pt="log" aria-pressed="${lg}">Registro</button><button class="pill" data-pt="chart" aria-pressed="${!lg}">Gráficos</button></div>${body}</div><div class="spacer"></div></div>`;
}
function sGrupo(){
  return `<div class="screen">${header('Grupo',true)}
   <div class="band pad"><div class="profile"><span class="av" style="background:var(--ink);width:60px;height:60px;color:var(--lime);font-style:italic;font-size:22px">LP</span><div class="who"><h2 style="color:var(--ink)">Liga dos Seis</h2><div class="stats" style="color:var(--ink)"><div class="stat"><i style="background:var(--ink)"></i><div><b>6</b><small>membros</small></div></div><div class="stat"><i style="background:var(--ink)"></i><div><b>12</b><small>semanas</small></div></div></div></div></div></div>
   <div class="sec pad"><div class="sec-h"><h2>Regras</h2><span>definidas pelo admin</span></div><ul class="rules">
    <li>Promessa trava ${PRAZO}. Quem não montar fica com os mínimos do grupo.</li>
    <li>Meta mínima: pontos proporcionais ao que foi postado. Sem post, zero.</li>
    <li>Limite máximo: ${BASE_MAX} pts dentro do limite, −${MULTA} por unidade acima.</li>
    <li>Bateu a meta inteira: bônus de ${BONUS} pts.</li>
    <li>Três contestações derrubam os pontos de um post.</li>
    <li>Peso e medidas são só registro e não pontuam.</li></ul>
    <div class="preview">Meta 3 L de água, postou 500 ml → <b>${Math.round(BASE_MIN*500/3000)} de ${BASE_MIN} pts</b><br>Meta 0 doce, comeu 1 → <b>−${MULTA} pts</b><br>Meta 3 treinos, fez 3 → <b>${BASE_MIN+BONUS} pts</b></div>
    <div class="sec-h"><h2>Membros</h2></div><div class="rows">${players.map(p=>`<div class="prow">${av(p,40)}<span class="tx"><b>${p.nome}</b><small>${p.streak>0?dias(p.streak):'sem sequência'}</small></span><span class="rt">${p.id===0?'admin':'membro'}</span></div>`).join('')}</div>
    <button class="btn dark" id="logout">Sair</button><p class="note">Protótipo de layout. Dados de exemplo; nada é salvo.</p></div><div class="spacer"></div></div>`;
}

/* ---------- render ---------- */
const TABS=[['home','Início','home'],['promessa','Promessa','doc'],['rank','Ranking','star'],['feed','Comunidade','group']];
function render(){
  const app=document.getElementById('app');
  if(state.screen==='splash'){app.innerHTML=sSplash();document.getElementById('start').onclick=()=>{state.screen='login';render()};return}
  if(state.screen==='login'){app.innerHTML=sLogin();
    document.getElementById('lg-back').onclick=()=>{state.screen='splash';render()};
    const go=e=>{e&&e.preventDefault();state.screen='app';render();toast('Você entrou no grupo Liga dos Seis.')};
    document.getElementById('lg-form').onsubmit=go;document.getElementById('lg-go').onclick=go;return}
  const view=state.sub==='progresso'?sProg():state.sub==='grupo'?sGrupo():{home:sHome,promessa:sProm,rank:sRank,feed:sFeed}[state.tab]();
  const showFab=state.fase==='semana'&&!state.sub;
  app.innerHTML=view+(showFab?`<button class="fab" id="fab">${ic('plus')}Registrar</button>`:'')+
   `<nav class="nav" aria-label="Seções"><div class="nav-in" role="tablist">${TABS.map(([k,l,i])=>`<button role="tab" aria-selected="${!state.sub&&state.tab===k}" data-tab="${k}">${ic(i)}${l}</button>`).join('')}</div></nav>`;
  bind();
}
function bind(){
  const $$=s=>document.querySelectorAll(s);
  $$('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;state.sub=null;render();scrollTo(0,0)});
  $$('[data-tab-go]').forEach(b=>b.onclick=e=>{e.preventDefault();state.tab=b.dataset.tabGo;state.sub=null;render();scrollTo(0,0)});
  $$('[data-go]').forEach(b=>b.onclick=()=>{state.sub=b.dataset.go;render();scrollTo(0,0)});
  $$('[data-back]').forEach(b=>b.onclick=()=>{state.sub=null;render()});
  $$('[data-go-cat]').forEach(b=>b.onclick=()=>{if(b.dataset.goCat)state.catFilter=b.dataset.goCat;abrirCatalogo()});
  $$('[data-bell]').forEach(b=>b.onclick=()=>toast('Ana curtiu seu treino. Faltam 3 dias para fechar a semana.'));
  $$('[data-pt]').forEach(b=>b.onclick=()=>{state.progTab=b.dataset.pt;render()});
  const fab=document.getElementById('fab');if(fab)fab.onclick=()=>abrirRegistro();
  const fm=document.getElementById('f-m');if(fm){fm.onclick=()=>{state.fase='montagem';render()};document.getElementById('f-s').onclick=()=>{state.fase='semana';render()}}
  const add=document.getElementById('add');if(add)add.onclick=()=>abrirCatalogo();
  $$('[data-rm]').forEach(b=>b.onclick=()=>{state.promessa.splice(+b.dataset.rm,1);render()});
  $$('[data-edit]').forEach(b=>b.onclick=()=>abrirMeta(+b.dataset.edit));
  $$('[data-log]').forEach(b=>b.onclick=()=>abrirRegistro(+b.dataset.log));
  $$('[data-like]').forEach(b=>b.onclick=()=>{const p=state.posts.find(x=>x.id==b.dataset.like);p.eu=!p.eu;p.curt+=p.eu?1:-1;render()});
  $$('[data-flag]').forEach(b=>b.onclick=()=>{const p=state.posts.find(x=>x.id==b.dataset.flag);p.contestei=!p.contestei;p.flag+=p.contestei?1:-1;toast(p.contestei?'Contestação enviada. Com 3 votos o post perde os pontos.':'Contestação retirada.');render()});
  $$('[data-cm]').forEach(b=>b.onclick=()=>{const p=state.posts.find(x=>x.id==b.dataset.cm);p.coment.push(['Você','Boa!']);render()});
  const lo=document.getElementById('logout');if(lo)lo.onclick=()=>{state.screen='splash';state.sub=null;state.tab='home';render()};
}

/* ---------- folhas ---------- */
function folha(titulo,topo,corpo){
  document.getElementById('layer').innerHTML=`<div class="scrim" id="scrim"></div><div class="sheet"><div class="sheet-in" role="dialog" aria-modal="true" aria-label="${titulo}">
   <div class="sheet-h pad"><h2>${titulo}</h2><button class="btn sm white" id="close">Fechar</button></div>${topo?`<div class="band pad">${topo}</div>`:''}<div class="sheet-b pad">${corpo}</div></div></div>`;
  document.getElementById('scrim').onclick=fechar;document.getElementById('close').onclick=fechar;
}
function fechar(){document.getElementById('layer').innerHTML=''}
function toast(t){const b=document.getElementById('toast-box');b.innerHTML=`<div class="toast">${t}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>b.innerHTML='',2800)}

function abrirCatalogo(){
  const cats=['Todas',...new Set(CATALOG.habitos.map(h=>h.categoria))];
  folha('Catálogo de hábitos',`<input type="search" id="q" placeholder="Buscar: água, bike, doce, sono..." value="${state.busca}" aria-label="Buscar hábito">
   <div class="cats" id="cats">${cats.map(c=>`<button class="pill" aria-pressed="${state.catFilter===c}" data-c="${c}">${c}</button>`).join('')}</div>`,`<div id="lista"></div>`);
  const pinta=()=>{
    const q=state.busca.toLowerCase(),ed=state.fase==='montagem';
    const it=CATALOG.habitos.filter(h=>(state.catFilter==='Todas'||h.categoria===state.catFilter)&&(!q||h.nome.toLowerCase().includes(q)||h.categoria.toLowerCase().includes(q)));
    document.getElementById('lista').innerHTML=`<div class="note">${it.length} hábitos${ed?'':' · adicionar só na fase de montagem'}</div>`+(it.map(h=>{const tem=state.promessa.some(p=>p.id===h.id);
      return `<div class="cat-item"><div><b>${h.nome}</b><small>${h.categoria} · ${h.modo==='max'?'limite máx.':'meta'} ${fmt(h.meta_sugerida)} ${h.unidade}</small></div>
       <button class="btn sm ${tem?'dark':'lime'}" data-add="${h.id}" ${tem||!ed?'disabled':''}>${tem?'Na promessa':'Adicionar'}</button></div>`}).join('')||'<p class="note">Nada encontrado.</p>');
    document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>abrirMeta(null,b.dataset.add));
  };
  document.getElementById('q').oninput=e=>{state.busca=e.target.value;pinta()};
  document.querySelectorAll('#cats .pill').forEach(b=>b.onclick=()=>{state.catFilter=b.dataset.c;document.querySelectorAll('#cats .pill').forEach(x=>x.setAttribute('aria-pressed',x===b));pinta()});
  pinta();
}
function abrirMeta(idx,id){
  const novo=idx===null,h=H[novo?id:state.promessa[idx].id],atual=novo?h.meta_sugerida:state.promessa[idx].meta;
  folha(novo?'Adicionar à promessa':'Alterar meta',`<div style="color:var(--ink)"><b style="font-size:16px">${h.nome}</b><div style="font-size:12px">${h.categoria} · evidência: ${h.evidencia}</div>${h.nota?`<div style="font-size:12px;margin-top:4px">${h.nota}</div>`:''}</div>
   <div class="field"><label for="m">${h.modo==='max'?'Limite máximo':'Meta da semana'} (${h.unidade})</label><input type="number" id="m" min="0" value="${atual}" inputmode="decimal"></div>`,
   `<div class="preview" id="pv"></div><button class="btn lime" id="ok">${novo?'Adicionar':'Salvar meta'}</button>`);
  const pv=()=>{const m=+document.getElementById('m').value;document.getElementById('pv').innerHTML=h.modo==='max'?`Ficar em até ${fmt(m)} ${h.unidade} vale <b>${BASE_MAX} pts</b>. Cada unidade acima tira <b>${MULTA} pts</b>.`:`Cumprir ${fmt(m)} ${h.unidade} vale <b>${BASE_MIN+BONUS} pts</b>. Metade vale <b>${BASE_MIN/2} pts</b>.`};
  document.getElementById('m').oninput=pv;pv();
  document.getElementById('ok').onclick=()=>{const m=+document.getElementById('m').value;
    if(h.modo==='min'&&!(m>0)){toast('Informe uma meta maior que zero.');return}
    if(novo)state.promessa.push({id:h.id,meta:m,real:0});else state.promessa[idx].meta=m;
    fechar();state.tab='promessa';state.sub=null;render();toast(novo?'Hábito adicionado à promessa.':'Meta atualizada.')};
}
function abrirRegistro(pre){
  if(!state.promessa.length){toast('Sua promessa está vazia.');return}
  folha('Registrar atividade',`<div class="field"><label for="sel">Hábito da promessa</label><select id="sel">${state.promessa.map((p,i)=>`<option value="${i}" ${i===pre?'selected':''}>${H[p.id].nome}</option>`).join('')}</select></div>
   <div class="field"><label for="qt" id="ql">Quantidade</label><input type="number" id="qt" min="0" step="any" inputmode="decimal" placeholder="0"></div>
   <div class="field"><label for="tx">Comentário</label><input type="text" id="tx" placeholder="Como foi?"></div>`,
   `<div class="field"><label for="ft" style="color:var(--white)">Evidência (foto ou print)</label><input type="file" id="ft" accept="image/*"><span class="note" id="ev"></span></div>
   <div class="preview" id="pv"></div><button class="btn lime" id="ok">Publicar</button>`);
  const sel=document.getElementById('sel'),cur=()=>state.promessa[+sel.value];
  const pv=()=>{const p=cur(),h=H[p.id],q=+document.getElementById('qt').value||0,d={...p,real:p.real+q};
    document.getElementById('ql').textContent=`Quantidade (${h.unidade})`;document.getElementById('ev').textContent='Pede: '+h.evidencia;
    document.getElementById('pv').innerHTML=`Depois deste post: ${fmt(d.real)} de ${fmt(p.meta)} ${h.unidade}. Pontos do hábito: <b>${sinal(ptsHab(d))}</b> (${sinal(ptsHab(d)-ptsHab(p))}).`};
  sel.onchange=pv;document.getElementById('qt').oninput=pv;pv();
  document.getElementById('ok').onclick=()=>{const q=+document.getElementById('qt').value;
    if(!(q>0)){toast('Informe uma quantidade maior que zero. Sem número, não vale.');return}
    const p=cur(),h=H[p.id],antes=ptsHab(p);p.real+=q;
    state.posts.unshift({id:Date.now(),autor:0,quando:'agora',hab:p.id,txt:document.getElementById('tx').value||'Registro feito.',valor:`${fmt(q)} ${h.unidade}`,foto:document.getElementById('ft').files.length>0,curt:0,coment:[],flag:0});
    state.atividades.unshift({hab:p.id,quando:'Hoje',valor:`${fmt(q)} ${h.unidade}`,pts:ptsHab(p)-antes});
    if(!state.checkins.includes(15))state.checkins.push(15);
    fechar();state.tab='promessa';state.sub=null;render();toast('Publicado. Pontos atualizados.')};
}
render();
</script>
</body></html>
