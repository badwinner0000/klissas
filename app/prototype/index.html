<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Liga da Promessa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: app de celular em coluna única, barra de abas embaixo, folhas deslizantes para registrar e escolher hábitos. */
:root{
  --bg:#eef2f5; --surface:#ffffff; --ink:#0f1b2d; --muted:#5b6b7d; --line:#d9e1e8;
  --accent:#0a6c8f; --accent-ink:#ffffff; --gold:#b8860b; --gold-bg:#fbf1d3;
  --good:#17803d; --good-bg:#dff3e5; --bad:#b42318; --bad-bg:#fbe3e0; --warn-bg:#fdf0d5;
  --shadow:0 1px 2px rgba(15,27,45,.08),0 6px 20px rgba(15,27,45,.06);
  --font-display:'Space Grotesk',system-ui,sans-serif; --font-body:'Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d151f; --surface:#16212e; --ink:#e8eef4; --muted:#93a3b4; --line:#26364a;
  --accent:#4cc0e6; --accent-ink:#06202b; --gold:#e6b94a; --gold-bg:#3a2f12;
  --good:#52d17c; --good-bg:#15321f; --bad:#ff8a7e; --bad-bg:#3d1a17; --warn-bg:#3a2f12;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d151f; --surface:#16212e; --ink:#e8eef4; --muted:#93a3b4; --line:#26364a;
  --accent:#4cc0e6; --accent-ink:#06202b; --gold:#e6b94a; --gold-bg:#3a2f12;
  --good:#52d17c; --good-bg:#15321f; --bad:#ff8a7e; --bad-bg:#3d1a17; --warn-bg:#3a2f12;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));margin:0}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  padding:12px max(16px,env(safe-area-inset-left,0px)) 8px max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand h1{font-size:20px}
.phase{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px;font-size:12px}
.phase button{border:0;background:none;padding:5px 10px;border-radius:999px;color:var(--muted)}
.phase button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.weekline{margin-top:8px;display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.weekline strong{color:var(--ink)}
main{flex:1;padding:8px max(16px,env(safe-area-inset-left,0px)) 110px max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.sec-title{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:4px 0 -4px}
.sec-title h2{font-size:17px}
.sec-title span{font-size:12px;color:var(--muted)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{width:100%;max-width:480px;display:grid;grid-template-columns:repeat(4,1fr);padding:0 max(8px,env(safe-area-inset-left,0px))}
.tab{border:0;background:none;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted)}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--accent);font-weight:600}
.fab{position:fixed;z-index:7;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));
  background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:12px 18px;font-weight:600;box-shadow:var(--shadow)}
.view[hidden]{display:none}
/* ranking */
.pod{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end}
.pod .p{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:10px 6px;text-align:center;min-width:0}
.pod .p.first{padding-top:18px;padding-bottom:16px}
.pod .name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod .pts{font-family:var(--font-display);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.pod .pos{font-size:11px;color:var(--muted)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;margin:0 auto 6px;color:#fff;flex:none}
.rank{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:26px 40px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .n{font-family:var(--font-display);font-weight:700;color:var(--muted)}
.row .who{min-width:0}
.row .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .who small{color:var(--muted)}
.row .av{margin:0;width:40px;height:40px}
.row .score{text-align:right;font-family:var(--font-display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.row .score small{display:block;font-family:var(--font-body);font-weight:500;font-size:11px}
.me{background:var(--gold-bg);margin:0 -14px;padding-left:14px;padding-right:14px;border-radius:10px;border-top-color:transparent!important}
.up{color:var(--good)} .down{color:var(--bad)}
.pot{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pot b{font-family:var(--font-display);font-size:22px}
/* promessa */
.lock{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;font-size:13px;background:var(--warn-bg)}
.lock.on{background:var(--good-bg)}
.hab{display:flex;flex-direction:column;gap:8px}
.hab+.hab{border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.hab-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.hab-top b{display:block}
.hab-top small{color:var(--muted)}
.chip{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.neutral{background:var(--bg);color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.max i{background:var(--good)} .bar.over i{background:var(--bad)}
.hab-foot{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}
.empty{color:var(--muted);text-align:center;padding:16px}
/* feed */
.post{display:flex;flex-direction:column;gap:10px}
.post-h{display:flex;gap:10px;align-items:center}
.post-h .av{margin:0;width:36px;height:36px;font-size:13px}
.post-h small{color:var(--muted);display:block}
.ph{border-radius:10px;aspect-ratio:16/10;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:500;
  background:linear-gradient(135deg,#2c7da0,#468faf);max-width:100%}
.ph.b{background:linear-gradient(135deg,#3a7d5c,#52a37a)} .ph.c{background:linear-gradient(135deg,#8a5a3c,#b57a52)} .ph.d{background:linear-gradient(135deg,#5a4a8a,#7a68b5)}
.post-tag{display:flex;gap:6px;flex-wrap:wrap}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.acts .btn.flag[aria-pressed="true"]{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.cmt{font-size:13px;color:var(--muted)} .cmt b{color:var(--ink)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,12,20,.5);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;display:flex;justify-content:center}
.sheet-in{background:var(--surface);width:100%;max-width:480px;border-radius:18px 18px 0 0;max-height:88vh;overflow:auto;
  padding:16px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:12px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet-h h2{font-size:18px}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
input[type=text],input[type=number],input[type=search],select{width:100%;font:inherit;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.cats button{white-space:nowrap;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 11px;font-size:13px}
.cats button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cat-item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.cat-item div{min-width:0}
.cat-item small{color:var(--muted);display:block}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.preview{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:13px}
.rules li{margin-bottom:6px}
.note{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  border-radius:10px;padding:9px 14px;font-size:13px;z-index:30;max-width:90vw}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .35s ease}}
</style>

</head><body><div class="app" id="app">

</div>

/* pontuação: meta mínima proporcional; limite máximo ganha dentro do limite e perde por excesso */
function ptsHab(p){
  const h=H[p.id];
  if(h.modo==='min'){
    const f=Math.min(1,p.real/p.meta);
    return Math.round(BASE_MIN*f + (p.real>=p.meta?BONUS:0));
  }
  if(p.real<=p.meta) return BASE_MAX;
  return -(p.real-p.meta)*MULTA;
}
function meusPts(){return state.promessa.reduce((s,p)=>s+ptsHab(p),0)}
function fmt(n){return n.toLocaleString('pt-BR')}
function sinal(n){return (n>0?'+':'')+n}
function ranking(){
  const me=players[0]; me.pts=me.base+meusPts();
  return [...players].sort((a,b)=>b.pts-a.pts);
}

function barHab(p){
  const h=H[p.id], max=h.modo==='max';
  const pct=max?Math.min(100,p.meta===0?(p.real>0?100:0):p.real/p.meta*100):Math.min(100,p.real/p.meta*100);
  const over=max&&p.real>p.meta;
  return `<div class="bar ${max?'max':''} ${over?'over':''}" role="progressbar" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>`;
}
function vProm(){
  const editavel=state.fase==='montagem';
  const lista=state.promessa.map((p,idx)=>{
    const h=H[p.id], pt=ptsHab(p), max=h.modo==='max';
    const tit = max ? `no máximo ${fmt(p.meta)} ${h.unidade}` : `${fmt(p.meta)} ${h.unidade}`;
    const prog = max ? `${fmt(p.real)} de ${fmt(p.meta)} ${h.unidade}` : `${fmt(p.real)} de ${fmt(p.meta)} ${h.unidade}`;
    const stat = max ? (p.real>p.meta?`<span class="chip bad">${pt} pts</span>`:`<span class="chip good">${sinal(pt)} pts</span>`)
                     : `<span class="chip ${pt>0?'good':'neutral'}">${sinal(pt)} pts</span>`;
    const dica = max ? (p.real>p.meta?`Passou do limite: ${MULTA} pts a menos por unidade`:`Dentro do limite vale ${BASE_MAX} pts`)
                     : (p.real>=p.meta?`Meta batida: bônus de ${BONUS} pts`:`${Math.round(p.real/p.meta*100)}% da meta, vale ${Math.round(BASE_MIN*p.real/p.meta)} de ${BASE_MIN} pts`);
    return `<div class="hab"><div class="hab-top"><div><b>${h.nome}</b><small>${h.categoria} · ${tit}</small></div>${stat}</div>
      ${barHab(p)}<div class="hab-foot"><span>${editavel?'Meta definida na montagem':prog}</span><span>${dica}</span></div>
      ${editavel?`<div class="row-actions"><button class="btn sm" data-edit="${idx}">Alterar meta</button><button class="btn sm" data-rm="${idx}">Remover</button></div>`:''}</div>`}).join('');
  document.getElementById('v-promessa').innerHTML=`
   <div class="lock ${editavel?'':'on'}">${editavel?`<span>Monte sua promessa até <strong>${PRAZO}</strong>. Depois disso ela trava e ninguém edita.</span>`:`<span>Promessa travada. Agora é postar o que você fez. Sem post, não vale.</span>`}</div>
   <div class="sec-title"><h2>Minha promessa</h2><span>${state.promessa.length} hábitos · ${sinal(meusPts())} pts</span></div>
   <div class="card">${state.promessa.length?lista:'<div class="empty">Nenhum hábito ainda. Adicione do catálogo.</div>'}</div>
   ${editavel?`<button class="btn pri" id="add">+ Adicionar hábito do catálogo (${CATALOG.habitos.length})</button>`:''}
   <div class="card"><b>Mínimos do grupo</b><div class="note" style="margin-top:4px">Valem para todos: 3 sessões de treino e 0 a 2 doces. Eles entram na sua promessa automaticamente.</div></div>`;
  if(editavel){
    document.getElementById('add').onclick=abrirCatalogo;
    document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{state.promessa.splice(+b.dataset.rm,1);render()});
    document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>abrirMeta(+b.dataset.edit));
  }
}

/* folhas */
function folha(titulo,corpo){
  const l=document.getElementById('layer');
  l.innerHTML=`<div class="scrim" id="scrim"></div><div class="sheet"><div class="sheet-in" role="dialog" aria-modal="true" aria-label="${titulo}">
    <div class="sheet-h"><h2>${titulo}</h2><button class="btn sm" id="close">Fechar</button></div>${corpo}</div></div>`;
  document.getElementById('scrim').onclick=fechar;document.getElementById('close').onclick=fechar;
}
function fechar(){document.getElementById('layer').innerHTML=''}
function toast(t){const b=document.getElementById('toast-box');b.innerHTML=`<div class="toast">${t}</div>`;setTimeout(()=>b.innerHTML='',2600)}

function abrirCatalogo(){
  const cats=['Todas',...new Set(CATALOG.habitos.map(h=>h.categoria))];
  folha('Catálogo de hábitos',`<input type="search" id="q" placeholder="Buscar: água, bike, doce, sono..." value="${state.busca}">
   <div class="cats" id="cats">${cats.map(c=>`<button aria-pressed="${state.catFilter===c}" data-c="${c}">${c}</button>`).join('')}</div><div id="lista"></div>`);
  const pinta=()=>{
    const q=state.busca.toLowerCase();
    const itens=CATALOG.habitos.filter(h=>(state.catFilter==='Todas'||h.categoria===state.catFilter)&&(!q||h.nome.toLowerCase().includes(q)||h.categoria.toLowerCase().includes(q)));
    document.getElementById('lista').innerHTML=itens.length?itens.map(h=>{
      const tem=state.promessa.some(p=>p.id===h.id);
      return `<div class="cat-item"><div><b>${h.nome}</b><small>${h.categoria} · ${h.modo==='max'?'limite máx. ':'meta '}${fmt(h.meta_sugerida)} ${h.unidade}</small></div>
      <button class="btn sm ${tem?'':'pri'}" data-add="${h.id}" ${tem?'disabled':''}>${tem?'Na promessa':'Adicionar'}</button></div>`}).join(''):'<div class="empty">Nada encontrado.</div>';
    document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>abrirMeta(null,b.dataset.add));
  };
  document.getElementById('q').oninput=e=>{state.busca=e.target.value;pinta()};
  document.querySelectorAll('#cats button').forEach(b=>b.onclick=()=>{state.catFilter=b.dataset.c;document.querySelectorAll('#cats button').forEach(x=>x.setAttribute('aria-pressed',x===b));pinta()});
  pinta();
}
function abrirMeta(idx,id){
  const novo=idx===null, h=H[novo?id:state.promessa[idx].id], atual=novo?h.meta_sugerida:state.promessa[idx].meta;
  folha(novo?'Adicionar à promessa':'Alterar meta',`<div><b>${h.nome}</b><div class="note">${h.categoria} · evidência: ${h.evidencia}</div>${h.nota?`<div class="note">${h.nota}</div>`:''}</div>
   <div><label for="m">${h.modo==='max'?'Limite máximo':'Meta da semana'} (${h.unidade})</label><input type="number" id="m" min="0" value="${atual}" inputmode="decimal"></div>
   <div class="preview" id="pv"></div><button class="btn pri" id="ok">${novo?'Adicionar':'Salvar meta'}</button>`);
  const pv=()=>{const m=+document.getElementById('m').value;
    document.getElementById('pv').innerHTML=h.modo==='max'?`Ficar em até ${fmt(m)} ${h.unidade} vale ${BASE_MAX} pts. Cada unidade acima tira ${MULTA} pts.`:`Cumprir ${fmt(m)} ${h.unidade} vale ${BASE_MIN+BONUS} pts. Cumprir metade vale ${BASE_MIN/2} pts.`};
  document.getElementById('m').oninput=pv;pv();
  document.getElementById('ok').onclick=()=>{const m=+document.getElementById('m').value;
    if(h.modo==='min'&&!(m>0)){toast('Informe uma meta maior que zero.');return}
    if(novo)state.promessa.push({id:h.id,meta:m,real:0});else state.promessa[idx].meta=m;
    fechar();render();toast(novo?'Hábito adicionado.':'Meta atualizada.')};
}
function abrirRegistro(){
  folha('Registrar atividade',`<div><label for="sel">Hábito da promessa</label><select id="sel">${state.promessa.map((p,i)=>`<option value="${i}">${H[p.id].nome}</option>`).join('')}</select></div>
   <div><label for="qt" id="ql">Quantidade</label><input type="number" id="qt" min="0" step="any" inputmode="decimal" placeholder="0"></div>
   <div><label for="tx">Comentário</label><input type="text" id="tx" placeholder="Como foi?"></div>
   <div><label for="ft">Evidência (foto ou print)</label><input type="file" id="ft" accept="image/*"><div class="note" id="ev"></div></div>
   <div class="preview" id="pv"></div><button class="btn pri" id="ok">Publicar</button>`);
  const sel=document.getElementById('sel');
  const atual=()=>state.promessa[+sel.value];
  const pv=()=>{const p=atual(),h=H[p.id],q=+document.getElementById('qt').value||0;
    document.getElementById('ql').textContent=`Quantidade (${h.unidade})`;
    document.getElementById('ev').textContent='Pede: '+h.evidencia;
    const depois={...p,real:p.real+q};const d=ptsHab(depois)-ptsHab(p);
    document.getElementById('pv').innerHTML=`Depois deste post: ${fmt(depois.real)} de ${fmt(p.meta)} ${h.unidade}. Pontos do hábito: ${sinal(ptsHab(depois))} (${sinal(d)}).`};
  sel.onchange=pv;document.getElementById('qt').oninput=pv;pv();
  document.getElementById('ok').onclick=()=>{
    const q=+document.getElementById('qt').value;
    if(!(q>0)){toast('Informe uma quantidade maior que zero. Sem número, não vale.');return}
    const p=atual(),h=H[p.id];p.real+=q;
    state.posts.unshift({id:Date.now(),autor:0,quando:'agora',hab:p.id,txt:document.getElementById('tx').value||'Registro feito.',valor:`${fmt(q)} ${h.unidade}`,
      foto:document.getElementById('ft').files.length?'d':null,curt:0,coment:[],flag:0});
    fechar();state.tab='promessa';render();toast('Publicado. Pontos atualizados.')};
}

document.getElementById('fab').onclick=abrirRegistro;
document.getElementById('ph-montar').onclick=()=>{state.fase='montagem';if(state.tab==='rank')state.tab='promessa';render()};
document.getElementById('ph-semana').onclick=()=>{state.fase='semana';render()};
render();
</script>
</body></html>
